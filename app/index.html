<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>毎日クイズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column. "今日" is a single card you tap through; "履歴" is a day strip above a ledger of answered questions. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunken:#F5F7FA; --ink:#1A2332; --muted:#5B6778; --line:#D3DAE3;
  --accent:#2E49D1; --accent-ink:#FFFFFF; --accent-soft:#E2E7FF;
  --mark:#F5C84C;
  --ok:#1C8556; --ok-soft:#DCF2E6; --ng:#BE3C35; --ng-soft:#FAE2DF;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141B; --surface:#19202A; --sunken:#141A22; --ink:#E6EBF2; --muted:#98A3B4; --line:#2B3442;
    --accent:#8FA3FF; --accent-ink:#0E1430; --accent-soft:#222B4C;
    --mark:#D9A92E;
    --ok:#4BC08A; --ok-soft:#163224; --ng:#F07B72; --ng-soft:#3A1D1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141B; --surface:#19202A; --sunken:#141A22; --ink:#E6EBF2; --muted:#98A3B4; --line:#2B3442;
  --accent:#8FA3FF; --accent-ink:#0E1430; --accent-soft:#222B4C;
  --mark:#D9A92E;
  --ok:#4BC08A; --ok-soft:#163224; --ng:#F07B72; --ng-soft:#3A1D1B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:.02em}
.today-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.today-meta b{color:var(--ink);font-family:var(--mono);font-size:15px}
.tabs{display:flex;gap:4px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 0;font-weight:700;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.goal{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.goal .pips{display:flex;gap:4px}
.goal .pip{width:22px;height:6px;border-radius:3px;background:var(--line)}
.goal .pip.on{background:var(--ok)}
.goal.done{color:var(--ok);font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.theme{font-weight:700;color:var(--ink);background:linear-gradient(transparent 58%,color-mix(in srgb,var(--mark) 70%,transparent) 58%);padding:0 2px}
.tag{border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:20px}
.prompt{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.75;margin:0;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:8px}
.choices.tf{flex-direction:row}
.choices.tf .choice{flex:1;text-align:center;justify-content:center;font-size:17px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;line-height:1.6;min-height:48px}
.choice .key{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:1px;flex:none}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice[disabled]{cursor:default}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice.dim{opacity:.55}

.result{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.verdict{font-family:var(--display);font-weight:700;font-size:18px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.next-due{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.next-due b{font-family:var(--mono);color:var(--ink)}
.unsure{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sunken);border-radius:999px;padding:4px 12px;font-size:13px}
.unsure[aria-pressed="true"]{border-color:var(--mark);background:color-mix(in srgb,var(--mark) 22%,var(--surface))}
.explain{background:var(--sunken);border-radius:10px;padding:12px 14px;font-size:14px}
.explain h3,.chat h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 4px;font-weight:700}

.md p{margin:0 0 .6em} .md p:last-child{margin-bottom:0}
.md ul{margin:.2em 0 .6em;padding-left:1.3em}
.md code{font-family:var(--mono);font-size:.88em;background:color-mix(in srgb,var(--line) 55%,transparent);padding:1px 5px;border-radius:4px}
.md pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:.4em 0 .7em}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}

.chat{display:flex;flex-direction:column;gap:10px;background:var(--sunken);border-radius:12px;padding:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.chip:hover:not([disabled]){background:var(--accent-soft)}
.chip[disabled]{opacity:.45;cursor:default}
.bubbles{display:flex;flex-direction:column;gap:8px}
.bubble{border-radius:10px;padding:10px 12px;font-size:14px;min-width:0}
.bubble.me{align-self:flex-end;background:var(--accent-soft);max-width:85%}
.bubble.ai{background:var(--surface);border:1px solid var(--line)}
.bubble.ai.thinking{color:var(--muted)}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.sub{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.ask .btn{background:transparent;color:var(--accent);border:1px solid var(--accent);flex:none}
.ask .btn:hover:not([disabled]){background:var(--accent-soft)}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.next-row{margin-top:10px}
.next-row .btn{width:100%;min-height:52px;font-size:16px}
.note{font-size:13px;color:var(--muted)}
.note.err{color:var(--ng)}

.empty{text-align:center;padding:28px 18px;gap:10px;align-items:center}
.empty .big{font-family:var(--display);font-weight:700;font-size:18px}

/* history */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted);font-family:var(--body)}
.range{display:flex;gap:6px}
.strip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 6px}
.bars{display:flex;align-items:flex-end;gap:3px;height:84px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:28px;border-radius:3px 3px 0 0;background:var(--accent)}
.bar i.zero{height:2px!important;background:var(--line)}
.bar .n{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:14px}
.labels{display:flex;gap:3px;margin-top:4px}
.labels span{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);min-width:0;overflow:hidden}
.day{display:flex;flex-direction:column;gap:6px}
.day h2{font-size:13px;color:var(--muted);margin:6px 0 0;font-weight:700;font-variant-numeric:tabular-nums}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row > button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;padding:10px 12px}
.mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.mark.ok{background:var(--ok-soft);color:var(--ok)} .mark.ng{background:var(--ng-soft);color:var(--ng)}
.row .body{min-width:0;flex:1}
.row .p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.55}
.row .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.row .detail{padding:0 12px 14px;display:flex;flex-direction:column;gap:12px}
footer{font-size:12px;color:var(--muted);text-align:center}
footer a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="toprow">
      <h1>毎日クイズ</h1>
      <div class="today-meta" id="meta"></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-today" data-action="tab" data-tab="today" aria-selected="true">今日</button>
      <button class="tab" role="tab" id="tab-history" data-action="tab" data-tab="history" aria-selected="false">履歴</button>
    </div>
  </header>
  <main id="view">
    <section class="card empty"><div class="big">読み込み中…</div><div class="note">問題と回答記録を取得しています。</div></section>
  </main>
  <footer>出題テーマは <a href="https://app.notion.com/p/9bbd11f66438418fadfa0140f43c356c" target="_blank" rel="noopener">Notionの学習テーマデータベース</a> で編集できます（翌朝から反映）</footer>
</div>

<script>
(() => {
  const PRI = { '高': 3, '中': 2, '低': 1 };
  const KEYS = ['A', 'B', 'C', 'D', 'E'];
  const z = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
  const TODAY = ymd(new Date());
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const dayLabel = s => { const [y, m, d] = s.split('-').map(Number); const dt = new Date(y, m - 1, d); return `${m}/${d}（${WD[dt.getDay()]}）`; };

  const S = {
    db: null, sample: null, config: null,
    due: [], dueLoaded: false, answers: [], answersLoaded: false, slow: false, dbError: null,
    tab: 'today', current: null, info: null, doneIds: new Set(),
    gen: { busy: false, error: null },
    chats: {}, chatBusy: false, chatCtl: null,
    range: 7, expanded: null, qcache: {},
  };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function inline(s) {
    return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }
  function md(src) {
    const parts = String(src ?? '').split(/```[a-zA-Z0-9_-]*\n?/);
    let out = '';
    parts.forEach((p, i) => {
      if (i % 2 === 1) { out += '<pre><code>' + esc(p.replace(/\n$/, '')) + '</code></pre>'; return; }
      // 改行のない長文（既存データ等）は、句点ごとに段落を分けて読みやすくする
      if (!/\n/.test(p.trim()) && p.length > 60) p = p.replace(/。(?=[^\s」』）)])/g, '。\n\n');
      const blocks = esc(p).split(/\n{2,}/);
      for (const b of blocks) {
        const t = b.trim(); if (!t) continue;
        const lines = t.split('\n');
        if (lines.every(l => /^\s*([-*・]|\d+\.)\s+/.test(l))) {
          out += '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*([-*・]|\d+\.)\s+/, '')) + '</li>').join('') + '</ul>';
        } else {
          out += '<p>' + lines.map(l => inline(l.replace(/^#{1,6}\s+/, ''))).join('<br>') + '</p>';
        }
      }
    });
    return out;
  }

  // ---- spaced repetition ----
  function schedule(prev, rating) {
    const iv = prev.interval || 0;
    let interval;
    if (rating === 'wrong') interval = 1;
    else if (rating === 'unsure') interval = iv < 1 ? 1 : Math.max(2, Math.round(iv * 1.3));
    else interval = iv < 1 ? 3 : Math.min(180, Math.round(iv * 2.5));
    return {
      interval, due: addDays(TODAY, interval),
      reps: (prev.reps || 0) + 1,
      lapses: (prev.lapses || 0) + (rating === 'wrong' ? 1 : 0),
    };
  }

  // ---- picking ----
  function nextQuestion() {
    const names = new Set(activeThemes().map(t => t.name));
    const cands = S.due.filter(q => !S.doneIds.has(q.id) && Array.isArray(q.choices) && q.choices.length >= 2 && (!names.size || names.has(q.theme)));
    cands.sort((a, b) => {
      const at = a.setDate === TODAY ? 0 : 1, bt = b.setDate === TODAY ? 0 : 1;
      if (at !== bt) return at - bt;
      return String(a.due).localeCompare(String(b.due));
    });
    return cands[0] || null;
  }
  const todayCount = () => S.answers.filter(a => a.date === TODAY).length;
  const goal = () => Math.max(1, Number(S.config?.dailyGoal) || 1);
  const activeThemes = () => (S.config?.themes || []).filter(t => t && t.name && t.status !== '一時停止');

  // ---- render ----
  const view = document.getElementById('view');
  function renderMeta() {
    const n = todayCount();
    document.getElementById('meta').innerHTML = `${dayLabel(TODAY)}・今日 <b>${n}</b> 問`;
  }
  function goalHtml() {
    const n = todayCount(), g = goal();
    const pips = Array.from({ length: g }, (_, i) => `<span class="pip${i < n ? ' on' : ''}"></span>`).join('');
    if (n >= g) return `<div class="goal done"><span class="pips">${pips}</span>今日の目標は達成。続けて解くこともできます</div>`;
    return `<div class="goal"><span class="pips">${pips}</span>今日の目標まであと ${g - n} 問</div>`;
  }

  function choicesHtml(q, info) {
    const tf = q.choices.length === 2 && q.choices.every(c => /^[○×◯✕]/.test(String(c).trim()));
    const btns = q.choices.map((c, i) => {
      let cls = 'choice';
      if (info) {
        if (i === q.answer) cls += ' correct';
        else if (i === info.idx) cls += ' wrong';
        else cls += ' dim';
      }
      const key = tf ? '' : `<span class="key">${KEYS[i]}</span>`;
      return `<button class="${cls}" data-action="answer" data-idx="${i}" ${info ? 'disabled' : ''}>${key}<span class="md">${inline(esc(c))}</span></button>`;
    }).join('');
    return `<div class="choices${tf ? ' tf' : ''}">${btns}</div>`;
  }

  function chatHtml(q) {
    if (!S.sample) return '';
    const turns = S.chats[q.id] || [];
    const chips = [['もっと詳しく', 'この問題の内容をもう少し詳しく説明して'], ['具体例で', '具体例やコード例で説明して'], ['実務では？', '実務（Webシステム開発）ではどう関わる？使いどころや注意点は？'], ['関連知識', 'あわせて覚えておくとよい関連知識を教えて']];
    const bubbles = turns.map((t, i) => t.role === 'user'
      ? `<div class="bubble me">${esc(t.label || t.content)}</div>`
      : `<div class="bubble ai md${t.pending && !t.content ? ' thinking' : ''}" data-turn="${i}">${t.content ? md(t.content) : (t.error ? esc(t.error) : '考えています…')}</div>`).join('');
    return `<div class="chat" data-qid="${esc(q.id)}">
      <h3>AIに聞く</h3>
      <div class="chips">${chips.map(([l, p]) => `<button class="chip" data-action="ask" data-q="${esc(p)}" data-label="${esc(l)}" ${S.chatBusy ? 'disabled' : ''}>${esc(l)}</button>`).join('')}</div>
      <div class="bubbles">${bubbles}</div>
      <form class="ask" data-action="askform"><input id="ask-${esc(q.id)}" name="q" placeholder="自由に質問（任意）" autocomplete="off" ${S.chatBusy ? 'disabled' : ''}><button class="btn small" ${S.chatBusy ? 'disabled' : ''}>質問する</button></form>
      ${S.chatBusy ? '<div class="actions"><button class="btn sub small" data-action="stop">止める</button></div>' : ''}
    </div>`;
  }

  function renderToday() {
    if (!S.db) {
      view.innerHTML = `<section class="card empty"><div class="big">データに接続できません</div><div class="note">claude.ai にログインした状態で開いてください。</div></section>`;
      return;
    }
    if (!S.dueLoaded || !S.answersLoaded) {
      view.innerHTML = `<section class="card empty"><div class="big">読み込み中…</div><div class="note">${S.slow ? '接続に時間がかかっています。電波の良い場所で開き直すと解消することがあります。' : '問題と回答記録を取得しています。'}</div></section>`;
      return;
    }
    if (!S.current) S.current = nextQuestion();
    const q = S.current;
    if (!q) {
      const canGen = S.sample && activeThemes().length;
      const n = todayCount();
      view.innerHTML = `${goalHtml()}<section class="card empty">
        <div class="big">${n ? '用意していた問題はすべて解きました' : '今日の問題はまだ届いていません'}</div>
        <div class="note">${n ? 'もっと解きたいときは、テーマに沿った問題をその場で作れます。' : '毎朝の準備で問題が追加されます。その場で作って解くこともできます。'}</div>
        ${canGen ? `<button class="btn" data-action="generate" ${S.gen.busy ? 'disabled' : ''}>${S.gen.busy ? '問題を作っています…' : '新しい問題を作る'}</button>` : ''}
        ${!activeThemes().length ? '<div class="note">有効な学習テーマがまだ同期されていません。</div>' : ''}
        ${S.gen.error ? `<div class="note err">${esc(S.gen.error)}</div>` : ''}
      </section>`;
      return;
    }
    const info = S.info;
    const kind = q.reps ? `復習・${q.reps + 1}回目` : '新しい問題';
    let after = '';
    if (info) {
      const unsureBtn = info.correct ? `<button class="unsure" data-action="unsure" aria-pressed="${info.rating === 'unsure'}">${info.rating === 'unsure' ? '✓ ' : ''}まぐれ・あやふやだった</button>` : '';
      after = `
        <div class="result">
          <span class="verdict ${info.correct ? 'ok' : 'ng'}">${info.correct ? '正解' : '不正解'}</span>
          <span class="next-due">次の出題 <b>${info.sched.interval}</b> 日後</span>
        </div>
        ${unsureBtn ? `<div>${unsureBtn}</div>` : ''}
        <div class="explain"><h3>解説</h3><div class="md">${md(q.explanation)}</div></div>
        ${info.saveError ? '<div class="note err">回答の記録に失敗しました。通信状況を確認して、もう一度開き直してください。</div>' : ''}
        ${chatHtml(q)}
        <div class="actions next-row"><button class="btn" data-action="next" ${S.gen.busy ? 'disabled' : ''}>${S.gen.busy ? '問題を作っています…' : '次の問題 →'}</button></div>
        ${S.gen.error ? `<div class="note err">${esc(S.gen.error)}</div>` : ''}`;
    }
    view.innerHTML = `${goalHtml()}<section class="card">
      <div class="qhead"><span class="theme">${esc(q.theme || 'テーマなし')}</span><span class="tag">${kind}</span></div>
      <div class="prompt md">${md(q.prompt)}</div>
      ${choicesHtml(q, info)}
      ${after}
    </section>`;
  }

  function renderHistory() {
    const from = addDays(TODAY, -(S.range - 1));
    const list = S.answers.filter(a => a.date >= from && a.date <= TODAY);
    const days = Array.from({ length: S.range }, (_, i) => addDays(from, i));
    const per = Object.fromEntries(days.map(d => [d, 0]));
    list.forEach(a => { if (a.date in per) per[a.date]++; });
    const max = Math.max(1, ...Object.values(per));
    const correct = list.filter(a => a.correct).length;
    const active = days.filter(d => per[d] > 0).length;
    const bars = days.map(d => `<div class="bar" title="${dayLabel(d)} ${per[d]}問">${per[d] ? `<span class="n">${per[d]}</span>` : ''}<i class="${per[d] ? '' : 'zero'}" style="height:${Math.round(per[d] / max * 64)}px"></i></div>`).join('');
    const labels = days.map((d, i) => { const dd = Number(d.slice(8)); const show = S.range === 7 || i % 5 === 0 || i === days.length - 1; return `<span>${show ? dd : ''}</span>`; }).join('');

    const byDay = {};
    list.forEach(a => (byDay[a.date] ||= []).push(a));
    const rows = Object.keys(byDay).sort().reverse().map(d => `<div class="day"><h2>${dayLabel(d)}・${byDay[d].length}問</h2>${byDay[d].map(rowHtml).join('')}</div>`).join('');

    view.innerHTML = `
      <div class="range">
        <button class="btn small ${S.range === 7 ? '' : 'sub'}" data-action="range" data-r="7">1週間</button>
        <button class="btn small ${S.range === 30 ? '' : 'sub'}" data-action="range" data-r="30">30日</button>
      </div>
      <div class="summary">
        <div class="stat"><div class="k">解いた問題</div><div class="v">${list.length}<small> 問</small></div></div>
        <div class="stat"><div class="k">正答率</div><div class="v">${list.length ? Math.round(correct / list.length * 100) : '–'}<small>${list.length ? ' %' : ''}</small></div></div>
        <div class="stat"><div class="k">取り組んだ日</div><div class="v">${active}<small> / ${S.range}日</small></div></div>
      </div>
      <div class="strip"><div class="bars">${bars}</div><div class="labels">${labels}</div></div>
      ${rows || '<section class="card empty"><div class="big">この期間の記録はまだありません</div><div class="note">「今日」タブで問題に答えると、ここに残ります。</div></section>'}`;
  }

  function rowHtml(a) {
    const open = S.expanded === a.id;
    const q = S.qcache[a.qid];
    let detail = '';
    if (open) {
      if (!q) detail = '<div class="note">読み込み中…</div>';
      else if (q === 'missing') detail = `<div class="note">あなたの回答：${esc(a.choice)}<br>正解：${esc(a.correctChoice)}</div>`;
      else detail = `${choicesHtml(q, { idx: q.choices.indexOf(a.choice) })}
        <div class="explain"><h3>解説</h3><div class="md">${md(q.explanation)}</div></div>
        <div class="next-due">次の出題予定 <b>${esc(q.due || '–')}</b></div>
        ${chatHtml(q)}`;
    }
    const t = new Date(a.answeredAt);
    const rating = a.correct ? (a.rating === 'unsure' ? '正解（あやふや）' : '正解') : '不正解';
    return `<div class="row"><button data-action="expand" data-id="${esc(a.id)}" aria-expanded="${open}">
      <span class="mark ${a.correct ? 'ok' : 'ng'}">${a.correct ? '○' : '×'}</span>
      <span class="body"><span class="p">${inline(esc(String(a.prompt || '').replace(/```[\s\S]*?```/g, '［コード］').replace(/\n/g, ' ')))}</span>
      <span class="meta"><span>${esc(a.theme)}</span><span>${rating}</span><span>${isNaN(t) ? '' : z(t.getHours()) + ':' + z(t.getMinutes())}</span></span></span>
    </button>${open ? `<div class="detail">${detail}</div>` : ''}</div>`;
  }

  function render() {
    renderMeta();
    document.getElementById('tab-today').setAttribute('aria-selected', S.tab === 'today');
    document.getElementById('tab-history').setAttribute('aria-selected', S.tab === 'history');
    if (S.tab === 'today') renderToday(); else renderHistory();
  }
  // Snapshot updates must not wipe out a card the viewer is working on.
  function refresh() {
    renderMeta();
    if (S.tab === 'history') { if (!S.chatBusy) renderHistory(); return; }
    if (!S.current || !S.dueLoaded || !S.answersLoaded) renderToday();
    else { const g = view.querySelector('.goal'); if (g) g.outerHTML = goalHtml(); }
  }

  // ---- actions ----
  async function answer(idx) {
    const q = S.current; if (!q || S.info) return;
    const correct = idx === q.answer;
    const rating = correct ? 'sure' : 'wrong';
    const prev = { interval: q.interval || 0, reps: q.reps || 0, lapses: q.lapses || 0 };
    S.info = { idx, correct, rating, prev, sched: schedule(prev, rating), ref: null };
    S.doneIds.add(q.id);
    renderToday();
    try {
      const ref = S.db.collection('answers').doc();
      await ref.set({ qid: q.id, theme: q.theme || '', prompt: q.prompt, choice: q.choices[idx], correctChoice: q.choices[q.answer], correct, rating, answeredAt: new Date().toISOString(), date: TODAY });
      S.info.ref = ref;
      await S.db.doc('questions/' + q.id).update({ ...S.info.sched, lastResult: rating, lastAnsweredAt: new Date().toISOString() });
    } catch (e) { S.info.saveError = true; renderToday(); }
  }
  async function toggleUnsure() {
    const q = S.current, info = S.info; if (!q || !info || !info.correct || info.busy) return;
    info.busy = true;
    info.rating = info.rating === 'unsure' ? 'sure' : 'unsure';
    info.sched = schedule(info.prev, info.rating);
    renderToday();
    try {
      if (info.ref) await info.ref.update({ rating: info.rating });
      await S.db.doc('questions/' + q.id).update({ ...info.sched, lastResult: info.rating });
    } catch (e) { info.saveError = true; renderToday(); }
    info.busy = false;
  }
  async function next() {
    S.current = null; S.info = null; S.gen.error = null;
    const q = nextQuestion();
    if (q || !S.sample || !activeThemes().length) { S.current = q; renderToday(); window.scrollTo({ top: 0 }); return; }
    await generate();
  }

  function pickTheme() {
    const ts = activeThemes();
    const total = ts.reduce((s, t) => s + (PRI[t.priority] || 1), 0);
    let r = Math.random() * total;
    for (const t of ts) { r -= PRI[t.priority] || 1; if (r <= 0) return t; }
    return ts[0];
  }
  function shuffle(q) {
    if (q.choices.length < 3) return q;
    const idx = q.choices.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return { ...q, choices: idx.map(i => q.choices[i]), answer: idx.indexOf(q.answer) };
  }
  async function generate() {
    if (S.gen.busy) return;
    const t = pickTheme(); if (!t) return;
    S.gen = { busy: true, error: null }; renderToday();
    const recent = S.answers.filter(a => a.theme === t.name).slice(0, 25).map(a => '- ' + String(a.prompt).slice(0, 120).replace(/\n/g, ' '));
    const prompt = `あなたは日本のWebエンジニア（経験12年、TypeScript/Vue.js/Java/Spring Boot/Docker、テックリードやアーキテクトを志向）向けに、1〜2分で解ける学習クイズを1問作る出題者です。

テーマ: ${t.name}
出題元: ${t.source || '（指定なし）'}
出題方針: ${t.memo || '（指定なし）'}

最近出題した問題（これらと重複・酷似しないこと）:
${recent.join('\n') || '（なし）'}

条件:
- 形式は4択（choicesが4つ）か○×（choicesが ["○ 正しい", "× 誤り"]）のどちらか。4択を基本に、ときどき○×。
- 正解は1つだけ。誤答の選択肢ももっともらしくする。
- 問題文はスマホで読める長さ（200字以内目安）。コードを含める場合は短く、\`\`\`で囲む。
- explanation は正解の理由と、誤答がなぜ違うかを300字以内で。読みやすいよう、「正解の理由」「誤答が違う理由」などの意味のまとまりごとに空行（\\n\\n）で段落を分け、誤答の説明は「- 」で始まる箇条書き（1行1項目）にする。
- すべて日本語。

次のJSONオブジェクトだけを返してください:
{"prompt": string, "choices": string[], "answer": 正解のchoicesの添字(0始まり), "explanation": string}`;
    try {
      const r = await S.sample.json(prompt, { cache: false });
      const ok = r && typeof r.prompt === 'string' && Array.isArray(r.choices) && r.choices.length >= 2 && r.choices.length <= 5
        && Number.isInteger(r.answer) && r.answer >= 0 && r.answer < r.choices.length && typeof r.explanation === 'string';
      if (!ok) throw { code: 'invalid_json' };
      const base = shuffle({ prompt: r.prompt, choices: r.choices.map(String), answer: r.answer });
      const doc = { theme: t.name, ...base, explanation: r.explanation, createdAt: new Date().toISOString(), due: TODAY, interval: 0, reps: 0, lapses: 0, source: 'その場で生成' };
      const ref = S.db.collection('questions').doc();
      await ref.set(doc);
      S.current = { id: ref.id, ...doc }; S.info = null;
      S.gen = { busy: false, error: null };
    } catch (e) {
      const msg = {
        not_granted: 'AIの利用が許可されていないため、問題を作れません。',
        sampling_disabled: 'このアカウントではAIを利用できません。',
        rate_limited: '利用上限に達したようです。少し時間をおいてから試してください。',
        invalid_json: '問題の形式が崩れました。もう一度試してください。',
      }[e && e.code] || '問題を作れませんでした。もう一度試してください。';
      S.gen = { busy: false, error: msg };
    }
    renderToday(); window.scrollTo({ top: 0 });
  }

  function chatTarget(qid) {
    if (S.current && S.current.id === qid) return { q: S.current, info: S.info };
    const q = S.qcache[qid];
    if (q && q !== 'missing') {
      const a = S.answers.find(x => x.id === S.expanded);
      return { q, info: a ? { idx: q.choices.indexOf(a.choice), correct: a.correct } : null };
    }
    return null;
  }
  function rerenderChat(qid) {
    const box = view.querySelector(`.chat[data-qid="${CSS.escape(qid)}"]`);
    const t = chatTarget(qid);
    if (box && t) { const tmp = document.createElement('div'); tmp.innerHTML = chatHtml(t.q); box.replaceWith(tmp.firstElementChild); }
  }
  async function ask(qid, text, label) {
    if (!S.sample || S.chatBusy || !text.trim()) return;
    const t = chatTarget(qid); if (!t) return;
    const { q, info } = t;
    const turns = (S.chats[qid] ||= []);
    const history = turns.filter(x => x.content && !x.error).map(x => ({ role: x.role, content: x.content }));
    turns.push({ role: 'user', content: text, label });
    const reply = { role: 'assistant', content: '', pending: true };
    turns.push(reply);
    S.chatBusy = true; rerenderChat(qid);
    const ctx = `あなたは、日本のWebエンジニア（経験12年、TypeScript/Vue.js/Java/Spring Boot/Docker、テックリードやアーキテクトを志向）の学習を手伝う講師です。彼は今、次のクイズに答えたところです。この問題に関する質問に、日本語で、スマホで1〜2分で読める分量（目安400字以内）で答えてください。見出しは使わず、必要なら箇条書きや短いコード例を使ってください。

テーマ: ${q.theme}
問題: ${q.prompt}
選択肢:
${q.choices.map((c, i) => `${KEYS[i]}. ${c}`).join('\n')}
正解: ${KEYS[q.answer]}. ${q.choices[q.answer]}
${info && info.idx >= 0 ? `彼の回答: ${KEYS[info.idx]}. ${q.choices[info.idx]}（${info.idx === q.answer ? '正解' : '不正解'}）` : ''}
解説: ${q.explanation}`;
    const input = [{ role: 'user', content: ctx }, ...history, { role: 'user', content: text }];
    const ctl = new AbortController(); S.chatCtl = ctl;
    try {
      await S.sample(input, {
        cache: false, signal: ctl.signal,
        onText: ({ text }) => {
          reply.content = text;
          const el = view.querySelector(`.chat[data-qid="${CSS.escape(qid)}"] [data-turn="${turns.length - 1}"]`);
          if (el) { el.classList.remove('thinking'); el.innerHTML = md(text); }
        },
      });
    } catch (e) {
      reply.content = e.text || '';
      if (e.code !== 'cancelled') reply.error = {
        not_granted: 'AIの利用が許可されていないため、質問できません。',
        rate_limited: '利用上限に達したようです。少し時間をおいてから試してください。',
      }[e.code] || '回答を取得できませんでした。もう一度試してください。';
      if (!reply.content && e.code === 'cancelled') reply.error = '止めました。';
    }
    reply.pending = false; S.chatBusy = false; S.chatCtl = null;
    rerenderChat(qid);
  }

  async function expand(id) {
    S.expanded = S.expanded === id ? null : id;
    renderHistory();
    const a = S.answers.find(x => x.id === id);
    if (S.expanded && a && !S.qcache[a.qid]) {
      try {
        const snap = await S.db.doc('questions/' + a.qid).get();
        S.qcache[a.qid] = snap.exists ? { id: snap.id, ...snap.data() } : 'missing';
      } catch (e) { S.qcache[a.qid] = 'missing'; }
      if (S.tab === 'history') renderHistory();
    }
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-action]'); if (!b || b.tagName === 'FORM') return;
    const act = b.dataset.action;
    if (act === 'tab') { S.tab = b.dataset.tab; render(); }
    else if (act === 'answer') answer(Number(b.dataset.idx));
    else if (act === 'unsure') toggleUnsure();
    else if (act === 'next') next();
    else if (act === 'generate') generate();
    else if (act === 'range') { S.range = Number(b.dataset.r); S.expanded = null; renderHistory(); }
    else if (act === 'expand') expand(b.dataset.id);
    else if (act === 'ask') ask(b.closest('.chat').dataset.qid, b.dataset.q, b.dataset.label);
    else if (act === 'stop') S.chatCtl?.abort();
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-action="askform"]'); if (!f) return;
    e.preventDefault();
    const v = f.elements.q.value; f.elements.q.value = '';
    ask(f.closest('.chat').dataset.qid, v);
  });

  // ---- boot ----
  async function boot() {
    const [db, sample] = await Promise.all([
      claude.use('db').catch(() => null),
      claude.use('sample').catch(() => null),
    ]);
    S.db = db; S.sample = sample;
    if (!db) { render(); return; }
    const timer = setTimeout(() => { S.slow = true; refresh(); }, 10000);
    const fail = err => { S.dbError = err; clearTimeout(timer); S.slow = true; S.dueLoaded = S.answersLoaded = true; refresh(); };
    db.doc('config/settings').onSnapshot(s => { S.config = s.exists ? s.data() : null; refresh(); }, () => {});
    db.collection('questions').where('due', '<=', TODAY).orderBy('due', 'asc').limit(300).onSnapshot(s => {
      S.due = s.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!s.metadata.fromCache) S.dueLoaded = true;
      if (S.dueLoaded && S.answersLoaded) clearTimeout(timer);
      refresh();
    }, fail);
    db.collection('answers').orderBy('answeredAt', 'desc').limit(1000).onSnapshot(s => {
      S.answers = s.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!s.metadata.fromCache) S.answersLoaded = true;
      if (S.dueLoaded && S.answersLoaded) clearTimeout(timer);
      refresh();
    }, fail);
  }
  render();
  if (window.claude && claude.use) boot(); else { S.db = null; setTimeout(render, 0); }
})();
</script>

</body></html>
